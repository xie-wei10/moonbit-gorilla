name: MoonBit quality checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: node tools/generate-xor-tests.mjs
      - run: moon fmt && moon info && git diff --exit-code
      - run: moon check
      - run: moon test --target wasm-gc
      - run: moon test --target js
      - run: moon build --target js
      - name: Refresh actual browser engine
        run: node tools/refresh-engines.mjs
      - run: node examples/run-metrics-query.mjs
      - run: node tools/test-query-archive.mjs
      - run: node tools/test-promtool-import.mjs
      - run: python3 tools/verify-prometheus-dump.py
      - run: node tools/test-demo.mjs
      - run: node tools/test-cli.mjs
      - run: node tools/test-blocks.mjs
      - run: node tools/test-xor-reference.mjs --golden
      - run: node tools/test-gor1-reference.mjs --golden
      - run: node tools/test-archive.mjs --golden
      - run: node tools/robustness.mjs
      - run: node tools/benchmark.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: evidence/
